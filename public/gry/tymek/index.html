<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1426">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tymek i Złote Jajo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Jeden ekran gry: płótno 16:9 wpasowane w okno, nad nim wybór broni, przyciski dotykowe i karty menu */
:root{
  --night:#1b1426; --panel:#2a1e38; --panel-edge:#4a3560;
  --gold:#f5b82e; --gold-deep:#b8741a; --rust:#c2412d; --cream:#fff4dc; --muted:#cbb9d8;
  --display:'Rye', Georgia, 'Times New Roman', serif;
  --body:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#game{display:block;border-radius:8px;box-shadow:0 0 0 3px #000,0 24px 60px rgba(0,0,0,.55)}

#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:5}
.wbtn{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;border:3px solid #000;
  background:var(--panel);color:var(--cream);font:700 15px/1 var(--body);cursor:pointer;box-shadow:0 3px 0 #000}
.wbtn svg{width:34px;height:34px;flex:none}
.wbtn kbd{font:800 12px/1 var(--body);color:var(--muted);background:#0006;border-radius:6px;padding:3px 6px}
.wbtn[aria-pressed="true"]{background:var(--gold);color:var(--night);transform:translateY(-2px)}
.wbtn[aria-pressed="true"] kbd{color:var(--night);background:#fff6}
.wbtn:focus-visible,.ibtn:focus-visible,.big:focus-visible{outline:3px solid var(--cream);outline-offset:2px}

#corner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:5}
.ibtn{width:44px;height:44px;border-radius:12px;border:3px solid #000;background:var(--panel);color:var(--cream);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #000;padding:0}
.ibtn svg{width:24px;height:24px}

.touch{position:fixed;z-index:6;display:none}
body.is-touch .touch{display:flex}
#pad{left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:190px;height:96px;
  border-radius:48px;background:#0005;border:3px solid #fff3;justify-content:space-between;align-items:center;padding:0 10px;box-sizing:border-box}
#pad span{width:72px;height:72px;border-radius:50%;background:#fff2;display:grid;place-items:center;font:800 34px/1 var(--body);color:#fffc}
#pad span.on{background:#fff6}
#acts{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));gap:16px;align-items:flex-end}
.tbtn{width:84px;height:84px;border-radius:50%;border:3px solid #000;display:grid;place-items:center;
  font:800 15px/1.05 var(--body);color:var(--night);text-align:center;box-shadow:0 4px 0 #000}
#tjump{background:#9fd7ff;margin-bottom:30px}
#tfire{background:var(--gold);width:96px;height:96px}
.tbtn.on{transform:translateY(3px);box-shadow:0 1px 0 #000}

#screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(18,10,28,.62);padding:16px;box-sizing:border-box}
.card{width:min(560px,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:var(--panel);border:4px solid #000;border-radius:20px;
  box-shadow:0 8px 0 #000,0 30px 80px rgba(0,0,0,.5);padding:22px 24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance;color:var(--gold);text-shadow:3px 3px 0 #000}
.card h1{font-size:clamp(30px,6vw,48px)}
.card h2{font-size:clamp(26px,5vw,38px)}
.card p{margin:0;font-size:17px;line-height:1.4;color:var(--cream);max-width:44ch}
.card .small{font-size:14px;color:var(--muted)}
.cast{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.cast span{font:700 13px/1 var(--body);background:#0004;border:2px solid var(--panel-edge);padding:5px 9px;border-radius:999px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.big{font:800 22px/1 var(--body);padding:14px 30px;border-radius:16px;border:4px solid #000;background:var(--gold);color:var(--night);
  cursor:pointer;box-shadow:0 5px 0 #000}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.big.alt{background:var(--panel-edge);color:var(--cream)}
.stars{font-size:40px;letter-spacing:6px;color:var(--gold);text-shadow:2px 2px 0 #000}
.stars i{font-style:normal;color:#00000066;text-shadow:none}
.levels{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.lv{font:800 16px/1 var(--body);width:40px;height:40px;border-radius:12px;border:3px solid #000;background:var(--panel-edge);color:var(--cream);cursor:pointer;box-shadow:0 3px 0 #000}
.lv:hover{background:var(--gold);color:var(--night)}
.lv:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.keys{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:14px;color:var(--muted);text-align:left}
.keys b{color:var(--cream);font-weight:800}
canvas.mini{width:120px;height:150px}
@media (max-height:480px){.card{padding:14px 18px;gap:8px}.card p{font-size:15px}canvas.mini{width:80px;height:100px}}
@media (prefers-reduced-motion:reduce){.wbtn[aria-pressed="true"]{transform:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" aria-label="Gra Tymek i Złote Jajo"></canvas></div>

<div id="hud" hidden>
  <button class="wbtn" data-w="0" aria-pressed="true" title="Kusza (1)">
    <svg viewBox="0 0 40 40"><path d="M5 21h25" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><path d="M27 6q-7 14 0 28" stroke="#d9d9d9" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M27 6L12 21 27 34" stroke="#fff" stroke-width="1.5" fill="none"/><path d="M14 18l22 0" stroke="#555" stroke-width="2"/><path d="M36 18l-4-3v6z" fill="#ccc"/></svg>
    Kusza <kbd>1</kbd></button>
  <button class="wbtn" data-w="1" aria-pressed="false" title="Łuk (2)">
    <svg viewBox="0 0 40 40"><path d="M14 4q18 16 0 32" stroke="#a0522d" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M14 4v32" stroke="#fff" stroke-width="1.5"/><path d="M6 20h28" stroke="#6b4423" stroke-width="2.5"/><path d="M37 20l-6-4v8z" fill="#ddd"/><path d="M6 20l-3-3M6 20l-3 3" stroke="#e44" stroke-width="2.5"/></svg>
    Łuk <kbd>2</kbd></button>
  <button class="wbtn" data-w="2" aria-pressed="false" title="Ogniste kamienie (3)">
    <svg viewBox="0 0 40 40"><path d="M20 4c4 7 12 10 9 20" fill="#ffb02e"/><path d="M14 8c-2 7-8 10-4 17" fill="#ff7a1a"/><circle cx="20" cy="26" r="11" fill="#6b4b3a" stroke="#000" stroke-width="2"/><circle cx="20" cy="26" r="6" fill="#ff5a1f"/><circle cx="17" cy="23" r="2.5" fill="#ffd36b"/></svg>
    Ogień <kbd>3</kbd></button>
</div>

<div id="corner" hidden>
  <button class="ibtn" id="bMute" title="Dźwięk (M)" aria-label="Wycisz dźwięk">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="mWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  <button class="ibtn" id="bPause" title="Pauza (P)" aria-label="Pauza">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
</div>

<div class="touch" id="pad" aria-hidden="true"><span id="pl">◀</span><span id="pr">▶</span></div>
<div class="touch" id="acts" aria-hidden="true">
  <div class="tbtn" id="tjump">SKOK</div>
  <div class="tbtn" id="tfire">STRZAŁ</div>
</div>

<div id="screen"><div class="card" id="card"></div></div>

<script>
(() => {
const W = 960, H = 540, G = 462, GRAV = 1800;
const cv = document.getElementById('game'), c = cv.getContext('2d');
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- skala płótna ---------- */
let dpr = 1, sc = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  sc = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * sc) + 'px'; cv.style.height = (H * sc) + 'px';
  cv.width = Math.round(W * sc * dpr); cv.height = Math.round(H * sc * dpr);
}
addEventListener('resize', resize); resize();

/* ---------- dźwięk ---------- */
let ac = null, master = null, muted = false;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination); } catch (e) { ac = null; }
}
function tone(type, f0, f1, dur, vol = 0.2, delay = 0) {
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq = 800) {
  const t = ac.currentTime, b = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = ac.createBufferSource(); s.buffer = b; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(master); s.start(t);
}
const SFX = {
  bolt: () => tone('square', 760, 260, 0.08, 0.07),
  arrow: () => { tone('triangle', 1200, 380, 0.13, 0.12); noise(0.08, 0.08, 3000); },
  throw: () => tone('sawtooth', 260, 130, 0.16, 0.08),
  boom: () => { noise(0.55, 0.5, 650); tone('sine', 130, 38, 0.45, 0.3); },
  hit: () => tone('square', 330, 140, 0.08, 0.09),
  hurt: () => tone('sawtooth', 420, 90, 0.35, 0.15),
  jump: () => tone('sine', 320, 660, 0.14, 0.11),
  pick: () => { tone('sine', 660, 660, 0.08, 0.12); tone('sine', 990, 990, 0.14, 0.12, 0.08); },
  cluck: () => { tone('square', 950, 480, 0.06, 0.05); tone('square', 900, 450, 0.06, 0.05, 0.08); },
  fire: () => noise(0.25, 0.14, 1400),
  rattle: () => { for (let i = 0; i < 6; i++) tone('square', 1500 - i * 140, 1150 - i * 140, 0.03, 0.05, i * 0.05); },
  roar: () => { tone('sawtooth', 120, 50, 0.9, 0.2); noise(0.8, 0.2, 380); },
  groan: () => { tone('sawtooth', 150, 85, 0.6, 0.1); tone('sawtooth', 156, 88, 0.6, 0.06); },
  thud: () => { noise(0.25, 0.35, 260); tone('sine', 90, 40, 0.25, 0.25); },
  laugh: () => [0, 1, 2, 3].forEach(i => tone('square', 280 - i * 18, 210 - i * 18, 0.11, 0.07, i * 0.15)),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f, 0.3, 0.15, i * 0.14)),
  level: () => [392, 523, 659, 784].forEach((f, i) => tone('triangle', f, f, 0.2, 0.14, i * 0.11)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone('triangle', f, f * 0.97, 0.3, 0.14, i * 0.2)),
};
function sfx(n) { if (!ac || muted) return; try { SFX[n](); } catch (e) {} }

/* ---------- poziomy ---------- */
const grp = (t, x, n, gap = 44) => Array.from({ length: n }, (_, i) => [t, x + i * gap]);
const BOSS = { demo: 'DEMOGORGON', oven: 'WAMPIRZY PIEKARNIK', dragon: 'SMOK ENDU' };
const LEVELS = [
  { name: 'Farma strasznych kur', len: 3400, theme: 'farm',
    enemies: [['chicken', 800], ['chicken', 1080], ['mole', 1400], ['chicken', 1700], ['chicken', 1780], ['mole', 2050], ['chicken', 2400], ['mole', 2700], ['chicken', 2950], ['chicken', 3050]] },
  { name: 'Jezioro latających ryb', len: 3700, theme: 'lake',
    enemies: [['fish', 900], ['mole', 1250], ['fish', 1550], ['fish', 2000], ['chicken', 2200], ['mole', 2450], ['fish', 2800], ['fish', 3150], ['chicken', 3300]] },
  { name: 'Cmentarzysko dinozaurów', len: 3900, theme: 'bones',
    enemies: [['dino', 950], ['chicken', 1350], ['dino', 1750], ['fish', 2100], ['mole', 2350], ['dino', 2650], ['fish', 3000], ['dino', 3400]] },
  { name: 'Las chodzących drzew', len: 3800, theme: 'forest',
    enemies: [['tree', 1000], ['chicken', 1350], ['tree', 1800], ['mole', 2150], ['tree', 2600], ['chicken', 2950], ['tree', 3300]] },
  { name: 'Ulica zombie na wózkach', len: 3800, theme: 'street',
    enemies: [['wzombie', 950], ['wzombie', 1500], ['mole', 1850], ['wzombie', 2250], ['wzombie', 2400], ['wzombie', 2900], ['wzombie', 3250], ['wzombie', 3350]] },
  { name: 'Żłobek zombiaków', len: 3600, theme: 'nursery',
    enemies: [...grp('baby', 1000, 3), ...grp('baby', 1700, 4), ...grp('baby', 2400, 5), ...grp('baby', 3050, 6)] },
  { name: 'Kuchnia wampirzego piekarnika', len: 1500, theme: 'kitchen', boss: true,
    enemies: [['chicken', 700], ['chicken', 760], ['oven', 1150]] },
  { name: 'Kraina Endu', len: 1600, theme: 'end', boss: true,
    enemies: [['dragon', 1150]] },
  { name: 'Kraina Demogorgona', len: 1500, theme: 'upside', boss: true,
    enemies: [['demo', 1150]] },
];
const WEAPONS = [{ name: 'Kusza', cd: 0.22 }, { name: 'Łuk', cd: 0.45 }, { name: 'Ogniste kamienie', cd: 0.75 }];

/* ---------- stan ---------- */
let state = 'menu', paused = false, L = 0, lvl = LEVELS[0];
let enemies = [], proj = [], parts = [], pickups = [], egg = null, boss = null;
let camX = 0, T = 0, shake = 0, introT = 0, kills = 0, total = 0, totalKills = 0, flashT = 0, doneT = 0, lastGroan = -9;
const P = { w: 0 };
const inp = { left: false, right: false, jump: false, fire: false };
let saved = 0;
try { saved = +localStorage.getItem('tymek-poziom') || 0; } catch (e) {}

function resetPlayer() {
  Object.assign(P, { x: 110, y: G, vx: 0, kx: 0, vy: 0, on: true, f: 1, cd: 0, hp: 5, inv: 0, t: 0, shot: 0 });
}

/* ---------- przeciwnicy ---------- */
const TYPES = {
  chicken: { w: 40, h: 50, hp: 2 }, mole: { w: 38, h: 46, hp: 2 }, fish: { w: 54, h: 30, hp: 2 },
  dino: { w: 96, h: 74, hp: 4 }, demo: { w: 70, h: 160, hp: 26 },
  tree: { w: 70, h: 150, hp: 7 }, wzombie: { w: 56, h: 72, hp: 3 }, baby: { w: 34, h: 28, hp: 1 },
  oven: { w: 104, h: 122, hp: 18 }, dragon: { w: 170, h: 56, hp: 24 },
};
function makeEnemy([t, x]) {
  const T0 = TYPES[t];
  const e = { t, x, y: G, w: T0.w, h: T0.h, hp: T0.hp, max: T0.hp, vx: 0, vy: 0, f: -1, on: true, flash: 0, dead: false, awake: false,
    tm: rnd(0.5, 2), st: 'idle', a: 0, anim: Math.random() * 10, seed: Math.random() * 1000, cd: rnd(1, 2), mouth: 0, open: 0 };
  if (t === 'fish') { e.by = rnd(250, 320); e.y = e.by; }
  if (t === 'mole') { e.st = 'hide'; e.hx = x; }
  if (t === 'demo' || t === 'oven') e.st = 'wait';
  if (t === 'oven') e.hop = 0.6;
  if (t === 'dragon') { e.st = 'wait'; e.by = 230; e.y = 230; e.tx = x; }
  return e;
}
function walkPhys(e, dt) {
  e.vy += GRAV * dt; e.x += e.vx * dt; e.y += e.vy * dt;
  if (e.y >= G) { e.y = G; e.vy = 0; e.on = true; } else e.on = false;
  e.x = clamp(e.x, 20, lvl.len - 20);
}
const AI = {
  chicken(e, dt) {
    const dx = P.x - e.x; if (Math.abs(dx) > 10) e.f = Math.sign(dx);
    const want = Math.abs(dx) < 620 ? e.f * 135 : 0;
    e.vx += (want - e.vx) * Math.min(1, dt * 3);
    e.tm -= dt; if (e.tm <= 0 && e.on) { e.vy = -rnd(300, 460); e.tm = rnd(0.9, 2.2); if (Math.abs(dx) < 500) sfx('cluck'); }
    e.anim += dt * (Math.abs(e.vx) / 30 + 2); walkPhys(e, dt);
  },
  mole(e, dt) {
    const dx = P.x - e.x; e.f = Math.sign(dx) || 1; e.tm -= dt; e.anim += dt * 8;
    if (e.st === 'hide') { e.a = 0; if (e.tm <= 0 && Math.abs(dx) < 460) e.st = 'rise'; }
    else if (e.st === 'rise') { e.a = Math.min(1, e.a + dt * 4); if (e.a >= 1) { e.st = 'up'; e.tm = 1.7; } }
    else if (e.st === 'up') { if (e.tm <= 0) e.st = 'down'; }
    else if (e.st === 'down') { e.a = Math.max(0, e.a - dt * 3.5); if (e.a <= 0) { e.st = 'hide'; e.tm = rnd(0.8, 1.8); } }
  },
  fish(e, dt) {
    const dx = P.x - e.x; e.f = Math.sign(dx) || 1; e.anim += dt;
    const side = e.x > P.x ? 1 : -1, tx = P.x + side * 250;
    e.vx += (clamp((tx - e.x) * 1.2, -150, 150) - e.vx) * Math.min(1, dt * 2);
    e.x = clamp(e.x + e.vx * dt, 30, lvl.len - 30);
    e.y = e.by + Math.sin(e.anim * 2.2) * 42;
    e.cd -= dt; e.mouth = Math.max(0, e.mouth - dt);
    if (e.cd < 0.45 && e.cd + dt >= 0.45) e.mouth = 0.6;
    if (e.cd <= 0 && Math.abs(dx) < 660) {
      const mx = e.x + e.f * 28, my = e.y - 16, ty = P.y - 38, d = Math.hypot(P.x - mx, ty - my) || 1;
      proj.push({ k: 'fire', from: 'e', x: mx, y: my, vx: (P.x - mx) / d * 280, vy: (ty - my) / d * 280, g: 0, life: 4 });
      e.cd = rnd(2.2, 3); sfx('fire');
    }
  },
  dino(e, dt) {
    if (e.st === 'pile') {
      e.tm -= dt;
      if (e.tm <= 0) { e.st = 'walk'; e.hp = 2; e.max = 2; e.revived = true; sfx('rattle'); burst(e.x, e.y - 30, 14, ['#f3ead7', '#cfc3a8'], 220, 700, 4); }
      return;
    }
    const dx = P.x - e.x; if (Math.abs(dx) > 12) e.f = Math.sign(dx);
    const want = Math.abs(dx) < 650 ? e.f * (e.revived ? 95 : 75) : 0;
    e.vx += (want - e.vx) * Math.min(1, dt * 2); e.anim += dt * (Math.abs(e.vx) / 25 + 1); walkPhys(e, dt);
  },
  demo(e, dt) {
    const dx = P.x - e.x;
    if (e.st === 'wait') { if (Math.abs(dx) < 620) wakeBoss(e); return; }
    e.tm -= dt; e.anim += dt;
    const fast = e.hp < e.max / 2;
    if (e.st === 'walk') {
      if (Math.abs(dx) > 30) e.f = Math.sign(dx);
      e.vx = e.f * (fast ? 95 : 70); e.open = Math.max(0, e.open - dt * 3);
      if (e.tm <= 0) { e.st = 'open'; e.tm = 0.85; sfx('roar'); }
    } else if (e.st === 'open') {
      e.vx = 0; e.open = Math.min(1, e.open + dt * 3); if (Math.abs(dx) > 10) e.f = Math.sign(dx);
      if (e.tm <= 0) { e.st = 'charge'; e.tm = fast ? 1.1 : 0.9; }
    } else if (e.st === 'charge') {

function groan() { if (T - lastGroan > 0.5) { lastGroan = T; sfx('groan'); } }

/* ---------- przebieg gry ---------- */

function update(dt) {
  T += dt; introT -= dt; flashT = Math.max(0, flashT - dt);
  // gracz
  const ax = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  P.vx = ax * 265; if (ax) P.f = ax;
  if (inp.jump && P.on) { P.vy = -770; P.on = false; sfx('jump'); }

  // przeciwnicy

    if ((p.k === 'fire' || p.k === 'ender') && Math.random() < 0.7) parts.push({ x: p.x, y: p.y, vx: rnd(-20, 20), vy: rnd(-40, 10), g: -60, life: 0.3, max: 0.3, c: p.k === 'ender' ? (Math.random() < 0.5 ? '#e07cff' : '#7a2aa8') : (Math.random() < 0.5 ? '#ffd36b' : '#ff5a1f'), s: rnd(3, 6) });

  let l = false, r = false; const rc = pad.getBoundingClientRect();
  for (const x of padIds.values()) { if (x < rc.left + rc.width / 2) l = true; else r = true; }
  inp.left = l; inp.right = r; $('#pl').classList.toggle('on', l); $('#pr').classList.toggle('on', r);
}
pad.addEventListener('pointerdown', e => { initAudio(); pad.setPointerCapture(e.pointerId); padIds.set(e.pointerId, e.clientX); padUpdate(); e.preventDefault(); });
pad.addEventListener('pointermove', e => { if (padIds.has(e.pointerId)) { padIds.set(e.pointerId, e.clientX); padUpdate(); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => pad.addEventListener(n, e => { padIds.delete(e.pointerId); padUpdate(); }));
for (const [id, key] of [['#tjump', 'jump'], ['#tfire', 'fire']]) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { initAudio(); el.setPointerCapture(e.pointerId); inp[key] = true; el.classList.add('on'); e.preventDefault(); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => el.addEventListener(n, () => { inp[key] = false; el.classList.remove('on'); }));
}
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- pętla ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play' && !paused) update(dt); else if (state === 'menu') T += dt;
  render(); requestAnimationFrame(loop);
}
resetPlayer(); showMenu();
requestAnimationFrame(loop);
})();
</script>
